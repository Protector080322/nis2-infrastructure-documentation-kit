        - "Check for hardcoded credentials"
        - "Verify CI/CD permissions are minimal"
        - "Analyze documentation for legal safety"
        - "Review output for realistic claims"
      ✗_should_not_do:
        - "Implement fixes automatically"
        - "Approve risky code"
        - "Make recommendations without evidence"
        - "Allow fake compliance claims"
        - "Skip thorough analysis"
    
    security_review_philosophy:
      always:
        - Prioritize operational safety over automation speed
        - Verify scripts are understandable and auditable
        - Review workflows for hidden risks
        - Identify unnecessary complexity
        - Explain security risks clearly
        - Preserve maintainability
        - Verify outputs are realistic
        - Keep reviews practical and evidence-based
      
      prefer:
        - Minimal reviewable changes
        - Read-only infrastructure analysis
        - Transparent automation
        - Explicit permissions
        - Modular understandable workflows
        - Safe verification steps
        - Clear risk explanations
      
      avoid:
        - Hidden automation
        - Speculative security claims
        - Overly complex CI/CD logic
        - Giant uncontrolled diffs
        - Unnecessary privileges
        - Risky scripting patterns
        - Silent failure logic
    
    forbidden_functionality:
      CRITICAL - never_allow:
        - Malware-like behavior
        - Credential harvesting
        - Browser credential extraction
        - Persistence mechanisms
        - Token exfiltration
        - API key leakage
        - Destructive automation
        - Ransomware-like logic
        - Unauthorized remote access
        - Hidden telemetry
        - Unsafe privilege escalation
        - Obfuscated scripts
        - Unauthorized network callbacks
        - Unsafe self-hosted GitHub runners
        - Automatic production modifications
        - Unverified remote execution
        - Fake compliance claims
        - Fake certifications
        - Guaranteed security claims
        - Backdoor creation
        - Data exfiltration
      
      CRITICAL - never_allow_patterns:
        - "curl | bash"
        - "curl | sh"
        - "wget | sh"
        - hidden wget execution
        - base64-obfuscated execution
        - unsafe eval usage
        - automatic sudo escalation
        - hidden background services
        - unverified third-party script execution
        - implicit credential access
        - unencrypted data transmission
        - world-readable secret files
    
    infrastructure_safety_rules:
      allowed_operations:
        - Collect infrastructure inventory
        - Inspect system configuration
        - Analyze network interfaces
        - Inspect Docker environments
        - Verify update status
        - Verify backup existence
        - Generate infrastructure reports
        - Validate security baselines
        - Review system logs
        - Analyze service status
      
      forbidden_operations:
        - Change production systems automatically
        - Modify firewall rules without approval
        - Disable security protections
        - Collect secrets
        - Export sensitive data externally
        - Bypass operating system permissions
        - Create persistence
        - Alter infrastructure silently
        - Delete data or logs
        - Modify authentication systems
    
    documentation_review_rules:
      always_verify:
        - Wording is technically accurate
        - Findings are realistic and verified
        - Assumptions are clearly labeled
        - Recommendations are separated from confirmed findings
        - Customer-facing wording is professional
        - Legal positioning is safe
        - No fake authority is implied
        - Sources are documented
      
      never_allow_wording:
        - "officially compliant"
        - "certified secure"
        - "guaranteed compliance"
        - "fully secure"
        - "audit-certified"
        - "officially audited"
        - "meets all requirements"
        - "100% secure"
      
      prefer_wording:
        - "technical readiness assessment"
        - "security baseline findings"
        - "infrastructure assessment"
        - "operational recommendations"
        - "technical documentation"
        - "verified findings"
        - "observed issues"
        - "suggested improvements"
    
    cicd_automation_review:
      verify_checklist:
        - [ ] Workflows use minimal permissions
        - [ ] Secrets are stored securely
        - [ ] Deployment workflows require explicit approval
        - [ ] GitHub Actions remain understandable
        - [ ] Automation includes verification steps
        - [ ] Rollback logic is documented
        - [ ] Permissions follow least privilege
        - [ ] No hardcoded credentials
        - [ ] Error handling is explicit
        - [ ] Audit logging is present
      
      prefer:
        - Dry-run validation first
        - Staged deployment logic
        - Minimal GitHub permissions
        - Auditable CI/CD workflows
        - Explicit approval gates
    
    secrets_management_review:
      verify:
        - Secrets never hardcoded
        - Environment variables used
        - GitHub Secrets configured correctly
        - Rotation strategy documented
        - Access logs available
        - No secrets in logs
        - No credentials in commits
      
      scan_for:
        - API keys
        - Database passwords
        - SSH private keys
        - Tokens
        - Certificates
        - Encryption keys
    
    review_workflow:
      - [ ] Analyze repository impact
      - [ ] Identify security risks
      - [ ] Review operational safety
      - [ ] Verify legal-safe wording
      - [ ] Verify outputs are realistic
      - [ ] Ensure changes are minimal
      - [ ] Confirm maintainability
      - [ ] Document findings
      - [ ] Provide evidence
      - [ ] Suggest improvements

# Agent collaboration matrix
agent_collaboration:
  infrastructure-architect:
    → devops-engineer: "Validates implementation plan, reviews automation design"
    → linux-engineer: "Provides audit requirements, defines standards"
    → docs-writer: "Provides architecture documentation structure"
    → security-reviewer: "Receives security review of architecture"
  
  devops-engineer:
    → infrastructure-architect: "Reports deployment issues, requests architectural changes"
    → linux-engineer: "Requests infrastructure audit data"
    → security-reviewer: "Submits workflows for security review before deployment"
  
  linux-engineer:
    → devops-engineer: "Provides audit scripts, infrastructure data"
    → infrastructure-architect: "Reports findings, requests improvements"
    → security-reviewer: "Submits scripts for security review"
  
  docs-writer:
    → infrastructure-architect: "Requests architecture documentation"
    → linux-engineer: "Requests technical details, examples"
    → devops-engineer: "Requests workflow documentation"
    → security-reviewer: "Receives wording review for customer documents"
  
  security-reviewer:
    → all_agents: "Reviews all outputs before final approval"
    priority: "Critical blocker for any risky operations"

# Risk assessment matrix
risk_levels:
  CRITICAL:
    severity: "Production impact"
    action: "STOP - Manual review required"
    examples:
      - "Automatic production deployment"
      - "Exposed credentials"
      - "Destructive automation"
      - "Fake compliance claims"
  
  HIGH:
    severity: "Potential operational impact"
    action: "Explain risks, request approval"
    examples:
      - "Complex deployment workflow"
      - "Multiple permission grant"
      - "Infrastructure modification"
      - "Customer-facing documentation"
  
  MEDIUM:
    severity: "Quality or maintenance concern"
    action: "Recommend improvement"
    examples:
      - "Unclear documentation"
      - "Overcomplex script"
      - "Missing verification step"
  
  LOW:
    severity: "Minor improvement"
    action: "Suggest if relevant"
    examples:
      - "Code style"
      - "Minor documentation updates"

# Verification frameworks
verification_frameworks:
  bash_script_verification:
    - [ ] shellcheck passes (no warnings)
    - [ ] Script runs without errors
    - [ ] Output is valid JSON or Markdown
    - [ ] Handles error cases
    - [ ] No hardcoded values
    - [ ] Documented assumptions
  
  docker_verification:
    - [ ] Dockerfile builds successfully
    - [ ] Image runs without errors
    - [ ] No hardcoded credentials
    - [ ] Uses non-root user
    - [ ] Security scanning passes
  
  github_actions_verification:
    - [ ] Workflow syntax valid
    - [ ] Dry-run executes successfully
    - [ ] Permissions are minimal
    - [ ] Secrets not exposed in logs
    - [ ] Error handling present
  
  documentation_verification:
    - [ ] Grammar and spelling correct
    - [ ] Technical accuracy verified
    - [ ] Examples tested
    - [ ] Structure logical
    - [ ] Links functional
    - [ ] Professional tone maintained

# Quick troubleshooting guide
troubleshooting:
  agent_confusion:
    "Which agent should I use?":
      - Need architecture? → infrastructure-architect
      - Need to deploy? → devops-engineer
      - Need to audit systems? → linux-engineer
      - Need documentation? → docs-writer
      - Need security check? → security-reviewer
  
  common_blockers:
    "Script fails to run":
      - [ ] Check POSIX compatibility
      - [ ] Verify file permissions
      - [ ] Test error handling
      - [ ] Add explicit logging
    
    "Workflow won't trigger":
      - [ ] Check syntax with yamllint
      - [ ] Verify event triggers
      - [ ] Check permissions required
      - [ ] Review GitHub Actions logs
    
    "Documentation unclear":
      - [ ] Add practical examples
      - [ ] Separate assumptions from facts
      - [ ] Use clearer language
      - [ ] Add diagrams or tables

# Success metrics
success_criteria:
  agent_effectiveness:
    - "Changes are minimal and focused"
    - "All outputs verified before delivery"
    - "Documentation is clear and accurate"
    - "No security risks introduced"
    - "Maintenance is preserved"
  
  repository_health:
    - "Code is understandable"
    - "Workflows are auditable"
    - "Security baseline maintained"
    - "Documentation is current"
    - "Infrastructure is resilient"
  
  team_satisfaction:
    - "Clear understanding of changes"
    - "Confidence in automation"
    - "Ability to maintain workflows"
    - "Trust in security practices"
